[pytest]
testpaths = tests
# Paths are relative to this file. server/ is here so `app.*` resolves the way
# it does when uvicorn runs it, tests/ so `helpers` imports without a package
# prefix, and the repo root (..) because extract.py lives there and the OCR
# tests import it — without it the suite only passed when run from the repo
# root, where the interpreter happens to add the working directory itself.
pythonpath = . tests ..
filterwarnings =
    error::DeprecationWarning:app.*
